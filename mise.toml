[bootstrap.packages]
"brew:container" = "latest"
"brew:git" = "latest"
"brew:jq" = "latest"
"brew:yq" = "latest"
"brew:k3d" = "latest"
"brew:vite" = "latest"
"brew:node" = "latest"
"brew:opencode" = "latest"
"brew:tailscale" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:claude-code" = "latest"
"brew-cask:dotnet-sdk" = "latest"

[bootstrap.mise_shell_activate]
zshrc = true

[dotfiles]
"~/.zprofile/mise-path" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }
"~/.zprofile/homebrew-path" = { line = 'export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"' }
"~/.zshrc/projects-directory" = { line = 'if [[ "$PWD" == "$HOME" && -d /Users/tt/projects ]]; then cd /Users/tt/projects; fi' }
# Bootstrap applies dotfiles after packages, including OpenCode, are installed.
"~/.local/bin/opencode-mise-shell" = { source = "opencode/mise-shell.tera", mode = "template", permissions = "0755" }
"~/.config/opencode/opencode.json/mise-shell" = { source = "opencode/config.jsonc.tera", merge = true, template = "tera" }

[bootstrap.macos.dock]
autohide = true
show_recents = false
apps = []

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.defaults.NSGlobalDomain]
"com.apple.trackpad.scaling" = 3.0

[bootstrap.macos.defaults."com.apple.WindowManager"]
StandardHideWidgets = true

[tasks.bootstrap]
depends = ["remove-apps", "setup-tailscale"]
run = "mkdir -p /Users/tt/projects"

[tasks.setup-tailscale]
description = "Run Tailscale at system boot"
run = '''
if ! cmp -s /opt/homebrew/bin/tailscaled /usr/local/bin/tailscaled || ! sudo launchctl print system/com.tailscale.tailscaled >/dev/null 2>&1; then
  # launchd owns the installer so stopping Tailscale cannot kill it with SSH.
  # Use a unique label so concurrent invocations cannot remove each other's job.
  label="com.tailscale.bootstrap-update.$(date +%s).$$"
  sudo launchctl submit -l "$label" \
    -o /var/log/tailscale-bootstrap-update.log \
    -e /var/log/tailscale-bootstrap-update.log \
    -- /bin/sh -c '
      job_label=$1
      cleanup() {
        result=$?
        trap - 0 HUP INT TERM
        echo "Tailscale daemon installation finished with exit code $result; removing launchd job $job_label"
        launchctl remove "$job_label"
        exit "$result"
      }
      trap cleanup 0
      trap "exit 129" HUP
      trap "exit 130" INT
      trap "exit 143" TERM
      sleep 5
      /opt/homebrew/bin/tailscaled install-system-daemon
    ' tailscale-bootstrap-update "$label"
  echo "Tailscale update scheduled via launchd ($label); SSH may disconnect briefly."
  echo "Update log: /var/log/tailscale-bootstrap-update.log"
fi
'''
raw = true

[tasks.remove-apps]
description = "Remove GarageBand, its sound library, iMovie, Keynote, Pages, and Numbers"
run = '''
sudo rm -rf /Applications/GarageBand.app /Applications/iMovie.app \
  "/Applications/Keynote Creator Studio.app" \
  "/Applications/Numbers Creator Studio.app" \
  "/Applications/Pages Creator Studio.app" \
  "/Library/Application Support/GarageBand" \
  "/Library/Audio/Apple Loops/Apple"
'''
raw = true
