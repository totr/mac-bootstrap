[bootstrap.packages]
"brew:container" = "latest"
"brew:git" = "latest"
"brew:jq" = "latest"
"brew:yq" = "latest"
"brew:k3d" = "latest"
"brew:vite" = "latest"
"brew:node" = "latest"
"brew:opencode" = "latest"
"brew:tailscale" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:claude-code" = "latest"
"brew-cask:dotnet-sdk" = "latest"

[bootstrap.mise_shell_activate]
zshrc = true

[dotfiles]
"~/.config/mise/conf.d/tools.toml" = { source = "mise/tools.toml" }
"~/.zshenv/dev-host" = { line = '''export DEV_HOST="$(export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; tailscale status --json 2>/dev/null | jq -r '(.Self.DNSName // "") | split(".")[0] // ""')"''' }
"~/Library/LaunchAgents/local.container.plist" = { source = "container/local.container.plist" }
"~/.zprofile/mise-path" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }
"~/.zprofile/homebrew-path" = { line = 'export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"' }
"~/.zprofile/dotnet-tools-path" = { line = 'export PATH="$HOME/.dotnet/tools:$PATH"' }
"~/.zshrc/projects-directory" = { line = 'if [[ "$PWD" == "$HOME" && -d /Users/tt/projects ]]; then cd /Users/tt/projects; fi' }
# Bootstrap applies dotfiles after packages, including OpenCode, are installed.
"~/.local/bin/opencode-mise-shell" = { source = "opencode/mise-shell.tera", mode = "template", permissions = "0755" }
"~/.config/opencode/opencode.json/mise-shell" = { source = "opencode/config.jsonc.tera", merge = true, template = "tera" }

[bootstrap.macos.dock]
autohide = true
show_recents = false
apps = []

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.defaults.NSGlobalDomain]
"com.apple.trackpad.scaling" = 3.0

[bootstrap.macos.defaults."com.apple.WindowManager"]
StandardHideWidgets = true

[tasks.bootstrap]
depends = ["remove-apps", "setup-container", "setup-tailscale", "setup-opencode", "setup-roslyn-mcp", "setup-codegraph"]
run = "mkdir -p /Users/tt/projects"

[tasks.setup-container]
description = "Initialize Apple Container and start it at login"
run = '''
set -eu
/opt/homebrew/bin/container system start --enable-kernel-install
if ! launchctl print "gui/$(id -u)/local.container" >/dev/null 2>&1; then
  launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/local.container.plist"
fi
'''

[tasks.setup-opencode]
description = "Restart the optional OpenCode boot service after package upgrades"
run = '''
set -eu
plist=/Library/LaunchDaemons/local.opencode.plist
if [ -f "$plist" ]; then
  # Run bootstrap as the same user selected when installing the boot service.
  # Disable and stop OpenCode's separate per-user background service.
  /opt/homebrew/bin/opencode service set disabled true
  if sudo launchctl print system/local.opencode >/dev/null 2>&1; then
    sudo launchctl kickstart -k system/local.opencode
  else
    sudo launchctl bootstrap system "$plist"
  fi
  echo "OpenCode boot service restarted with the installed version:"
  /opt/homebrew/bin/opencode --version
  echo "Connect with: opencode --server http://127.0.0.1:4096"
fi
'''
raw = true

[tasks.setup-codegraph]
description = "Install or update the standalone CodeGraph CLI"
run = '''
installer=$(curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh)
CODEGRAPH_INSTALL_DIR="$HOME/.codegraph" CODEGRAPH_BIN_DIR="$HOME/.local/bin" sh -c "$installer"
'''

[tasks.setup-roslyn-mcp]
description = "Install or update Roslyn MCP Server as a global .NET tool"
run = '''
# Current .NET SDKs also update existing tools with the install command.
dotnet tool install -g RoslynMcp.Server --allow-roll-forward
'''

[tasks.setup-tailscale]
description = "Run Tailscale at system boot"
run = '''
if ! cmp -s /opt/homebrew/bin/tailscaled /usr/local/bin/tailscaled || ! sudo launchctl print system/com.tailscale.tailscaled >/dev/null 2>&1; then
  # launchd owns the installer so stopping Tailscale cannot kill it with SSH.
  # Use a unique label so concurrent invocations cannot remove each other's job.
  label="com.tailscale.bootstrap-update.$(date +%s).$$"
  sudo launchctl submit -l "$label" \
    -o /var/log/tailscale-bootstrap-update.log \
    -e /var/log/tailscale-bootstrap-update.log \
    -- /bin/sh -c '
      job_label=$1
      cleanup() {
        result=$?
        trap - 0 HUP INT TERM
        echo "Tailscale daemon installation finished with exit code $result; removing launchd job $job_label"
        launchctl remove "$job_label"
        exit "$result"
      }
      trap cleanup 0
      trap "exit 129" HUP
      trap "exit 130" INT
      trap "exit 143" TERM
      sleep 5
      /opt/homebrew/bin/tailscaled install-system-daemon
    ' tailscale-bootstrap-update "$label"
  echo "Tailscale update scheduled via launchd ($label); SSH may disconnect briefly."
  echo "Update log: /var/log/tailscale-bootstrap-update.log"
fi
'''
raw = true

[tasks.remove-apps]
description = "Remove GarageBand, its sound library, iMovie, Keynote, Pages, and Numbers"
run = '''
sudo rm -rf /Applications/GarageBand.app /Applications/iMovie.app \
  "/Applications/Keynote Creator Studio.app" \
  "/Applications/Numbers Creator Studio.app" \
  "/Applications/Pages Creator Studio.app" \
  "/Library/Application Support/GarageBand" \
  "/Library/Audio/Apple Loops/Apple"
'''
raw = true
